# Poe2 | MapStat - campaign walkthrough: Acts 1-4 and the Interludes
# Made from the game's quest data (Quest, QuestStates, QuestRewardOffers, QuestRewards, WorldAreas, MonsterVarieties)
# and, for Act 4, a leveling sheet. (op) = optional. Lines under a step: boss and reward ("or" = pick one).
# League content (Expedition runestones, Incursion beacons, Abyss) is left out.
# "+ Act N" ... "+": a section, double-click it in the editor to fold / unfold.
# Quest: the quest the step completes.
# "From -> Zone": the steps when you come from that zone (a town visit after a boss, a zone you come back to);
# from anywhere else the plain steps of the zone are shown. Towns have a vendor search regex in their notes.

+ Act 1
The Riverbank
  Kill The Bloated Miller
  Go to Clearfell Encampment

The Riverbank -> Clearfell Encampment
  Talk to Renly
    Quest: Reaching Clearfell
    Reward: Uncut Skill Gem (level 1)
  Go to Clearfell

Clearfell Encampment
  Sell, then waypoint back to where you were
  Notes
    Vendor search: movement speed, +level of all spell skills, +maximum life
      "ovement sp|of all spell|maximum li"

