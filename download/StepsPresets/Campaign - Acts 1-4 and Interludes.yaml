# Poe2 | MapStat - campaign walkthrough: Acts 1-4 and the Interludes
# Made from the game's quest data (Quest, QuestStates, QuestRewardOffers, QuestRewards, WorldAreas, MonsterVarieties)
# and, for Act 4, a leveling sheet. (op) = optional. Lines under a step: boss and reward ("or" = pick one).
# League content (Expedition runestones, Incursion beacons, Abyss) is left out.
# "+ Act N" ... "+": a section, double-click it in the editor to fold / unfold.
# Quest: the quest the step completes.

